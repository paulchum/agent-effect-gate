# Nginx TEMPLATE, not a provisioned certificate or tested customer proxy.
# Replace domain/certificate paths; only this reverse proxy accepts remote traffic.
server {
    listen 443 ssl;
    server_name review.customer.example;
    ssl_certificate /etc/aeg-tls/fullchain.pem;
    ssl_certificate_key /etc/aeg-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    client_body_timeout 10s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 35s;
    }
}
