name: Feature request
description: Suggest an improvement to Agent Effect Gate.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the workflow you want to improve using non-sensitive examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the result you want and any alternatives you considered.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        All currently shipped features are MIT licensed. Future commercial ideas are described in [COMMERCIAL.md](https://github.com/paulchum/agent-effect-gate/blob/main/COMMERCIAL.md).
