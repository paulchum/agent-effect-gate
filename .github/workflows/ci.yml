name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build the offline application
        run: python scripts/build_release.py
      - name: Run core regressions and record unavailable host checks
        # Hosted runners do not qualify namespace isolation or different-UID tests.
        # Keep every skip and its reason in the report instead of claiming a full run.
        run: python verification/run_tests.py --output validation/ci-core.json
      - name: Verify synthetic authorization and read-limit regressions
        run: |
          python verification/release_matrix.py
          python verification/read_quota_regression.py
      - name: Verify the offline installation outside the source tree
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/aeg-offline-env"
          python install.py --venv "$RUNNER_TEMP/aeg-offline-env"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aeg-offline-env/bin/python" -I "$GITHUB_WORKSPACE/verification/installed_smoke.py"
          "$RUNNER_TEMP/aeg-offline-env/bin/python" -I "$GITHUB_WORKSPACE/verification/client_installed_smoke.py"
      - name: Build the wheel and standard source distribution
        run: |
          python -m pip install --requirement requirements-build.txt
          python -c 'from setuptools.build_meta import build_wheel, build_sdist; build_wheel("dist"); build_sdist("dist")'
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/aeg-sdist-wheel" dist/agent_effect_gate-*.tar.gz
      - name: Verify a wheel rebuilt from the source distribution
        run: |
          python -m venv "$RUNNER_TEMP/aeg-wheel-env"
          "$RUNNER_TEMP/aeg-wheel-env/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/aeg-sdist-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/aeg-wheel-env/bin/python" -I "$GITHUB_WORKSPACE/verification/installed_smoke.py"
          "$RUNNER_TEMP/aeg-wheel-env/bin/python" -I "$GITHUB_WORKSPACE/verification/client_installed_smoke.py"
      - name: Build and verify the complete offline distribution
        run: |
          python scripts/package.py --output "$RUNNER_TEMP/agent-effect-gate.zip"
          python scripts/check_package.py
      - name: Report the scope of hosted validation
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path('validation/ci-core.json')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('### Hosted core validation\n\n')
              summary.write('Real sandbox, different-UID, optional SDK, and live-service qualification require a separately provisioned Linux environment. See VALIDATION.md.\n\n')
              if not report.exists():
                  summary.write('The core suite did not produce a result. Inspect the failed step.\n')
              else:
                  data = json.loads(report.read_text())
                  summary.write(f"{data['passed']} passed; {data['failures']} failures; {data['errors']} errors; {data['skipped']} skipped.\n\n")
                  for skipped in data['skipped_tests']:
                      summary.write(f"- `{skipped['test']}`: {skipped['reason']}\n")
          PY
      - name: Retain builds and the current core report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-python-${{ matrix.python }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            validation/ci-core.json
            dist/
            ${{ runner.temp }}/agent-effect-gate.zip
